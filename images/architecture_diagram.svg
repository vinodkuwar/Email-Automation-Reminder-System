<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#0B0F17" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="840" height="60" rx="10" fill="url(#grad1)" />
  <text x="450" y="62" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    EMAIL AUTOMATION &amp; REMINDER SYSTEM — ARCHITECTURE
  </text>

  <!-- Data Sources -->
  <rect x="50" y="120" width="220" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="160" y="150" fill="#60A5FA" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">📁 DATA SOURCES</text>
  <rect x="70" y="170" width="180" height="35" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="160" y="192" fill="#F8FAFC" font-family="monospace" font-size="12" text-anchor="middle">data/contacts.csv</text>
  <rect x="70" y="215" width="180" height="35" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="160" y="237" fill="#F8FAFC" font-family="monospace" font-size="12" text-anchor="middle">data/reminders.csv</text>

  <!-- Processing Core -->
  <rect x="340" y="120" width="220" height="230" rx="12" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="2" />
  <text x="450" y="150" fill="#A5B4FC" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚙️ PROCESSING ENGINE</text>
  <rect x="360" y="170" width="180" height="30" rx="6" fill="#312E81" />
  <text x="450" y="190" fill="#E0E7FF" font-family="sans-serif" font-size="11" text-anchor="middle">contacts.py (Validation)</text>
  <rect x="360" y="210" width="180" height="30" rx="6" fill="#312E81" />
  <text x="450" y="230" fill="#E0E7FF" font-family="sans-serif" font-size="11" text-anchor="middle">templates.py (Placeholder)</text>
  <rect x="360" y="250" width="180" height="30" rx="6" fill="#312E81" />
  <text x="450" y="270" fill="#E0E7FF" font-family="sans-serif" font-size="11" text-anchor="middle">scheduler.py (Due Ticker)</text>
  <rect x="360" y="290" width="180" height="30" rx="6" fill="#312E81" />
  <text x="450" y="310" fill="#E0E7FF" font-family="sans-serif" font-size="11" text-anchor="middle">email_sender.py (Dual-Mode)</text>

  <!-- Output / Delivery -->
  <rect x="630" y="120" width="220" height="230" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="740" y="150" fill="#34D399" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🚀 DISPATCH &amp; AUDIT</text>
  <rect x="650" y="170" width="180" height="40" rx="6" fill="#064E3B" stroke="#059669" />
  <text x="740" y="188" fill="#A7F3D0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Dry-Run Simulation</text>
  <text x="740" y="202" fill="#6EE7B7" font-family="sans-serif" font-size="9" text-anchor="middle">(DEFAULT: Safe Logging)</text>

  <rect x="650" y="220" width="180" height="40" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="740" y="238" fill="#CBD5E1" font-family="sans-serif" font-size="11" text-anchor="middle">Real SMTP Mode</text>
  <text x="740" y="252" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">(Gmail / TLS 587)</text>

  <rect x="650" y="270" width="180" height="35" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="740" y="292" fill="#F8FAFC" font-family="monospace" font-size="10" text-anchor="middle">outputs/email_report.csv</text>

  <rect x="650" y="310" width="180" height="30" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="740" y="328" fill="#F8FAFC" font-family="monospace" font-size="10" text-anchor="middle">logs/automation.log</text>

  <!-- Connectors -->
  <line x1="270" y1="195" x2="340" y2="195" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="560" y1="235" x2="630" y2="235" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Footer Banner -->
  <rect x="50" y="380" width="800" height="80" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="70" y="412" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="bold">🛡️ SAFETY GUARANTEE:</text>
  <text x="70" y="434" fill="#94A3B8" font-family="sans-serif" font-size="11">
    No real emails are dispatched unless EMAIL_MODE=real is explicitly set in .env with valid SMTP credentials.
  </text>
  <text x="70" y="450" fill="#94A3B8" font-family="sans-serif" font-size="11">
    All simulated dispatches are marked with status SIMULATED to preserve academic integrity.
  </text>
</svg>
